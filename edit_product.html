{% extends "base.html" %}{% block title %}Edit product | Smart Stock{% endblock %}{% block heading %}Edit product{% endblock %}
{% block content %}<section class="panel narrow"><div class="panel-head"><h2>Update product details</h2></div><form method="post" class="form-stack">
<label>Product name<input name="name" value="{{ product.name }}" required></label><label>Category<input name="category" value="{{ product.category }}"></label><label>Price (₹)<input name="price" type="number" min="0" step="0.01" value="{{ product.price }}" required></label><label>Quantity<input name="quantity" type="number" min="0" value="{{ product.quantity }}" required></label><label>Minimum stock<input name="min_stock" type="number" min="0" value="{{ product.min_stock }}" required></label><div class="form-actions"><button class="btn primary">Save changes</button><a class="btn light" href="{{ url_for('products') }}">Cancel</a></div></form></section>{% endblock %}
